[project]
name = "Mopidy-Mowecl"
description = "Web client for Mopidy"
authors = [
    {name = "Mathias Millet", email = "mathias@mmill.eu"},
]
requires-python = ">= 3.9"
readme = "README.rst"
license = { text = "Apache-2.0" }
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dynamic = ["version"]
dependencies = [
    "Mopidy >= 3.0",
    "Mopidy-Bookmarks >= 0.1.4",
    "Pykka >= 2.0.1",
    "musicbrainzngs>=0.7.1",
    "pylast>=4.0",
    "requests>=2.0",
]

[tool.uv.sources]
mopidy-bookmarks = { path = "../mopidy-bookmarks", editable = true }

[project.urls]
Homepage = "https://github.com/sapristi/mopidy-mowecl"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# mopidy_mowecl/static is the (git-ignored) frontend build output
# (see mowecl_react/vite.config.js), shipped as package data.
[tool.hatch.build]
artifacts = ["/mopidy_mowecl/static"]

[tool.hatch.build.targets.sdist]
include = ["/mopidy_mowecl", "/tests", "/README.rst", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["mopidy_mowecl"]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    {include-group = "test"},
    "pre-commit>=4.1.0",
    "ruff",
    # Mopidy 3 (resolved on Python < 3.13) imports pkg_resources
    "setuptools<81; python_version < '3.13'",
]

[project.entry-points."mopidy.ext"]
mowecl = "mopidy_mowecl:Extension"


[tool.ruff]
line-length = 80
target-version = "py39"
extend-exclude = ["mowecl_react", "mopidy_mowecl/static"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific rules
]
