[tox]
envlist = mopidy3, mopidy4, lint
requires =
    tox>=4.22

[testenv]
sitepackages = true
commands =
    python -m pytest \
        --basetemp={envtmpdir} \
        --cov=mopidy_mowecl --cov-report=term-missing \
        {posargs}

[testenv:mopidy3]
description = Test against Mopidy 3.4.2 (last 3.x)
# NOTE: needs GStreamer/gi system libs (sitepackages = true inherits them).
base_python = python3
deps =
    Mopidy==3.4.2
    Pykka>=2.0.1,<4
    Tornado>=6,<7
    setuptools<81
dependency_groups = test

[testenv:mopidy4]
description = Test against Mopidy 4.0.4
base_python = python3
deps =
    Mopidy==4.0.4
    Pykka>=4.1
    Tornado>=6.4
dependency_groups = test

[testenv:lint]
description = Run pre-commit hooks (ruff, eslint, ...) on all files
sitepackages = false
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
