name: Lint and test backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run pre-commit
        env:
          # eslint is covered by the frontend workflow
          SKIP: eslint
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test against ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    # Debian trixie ships Python 3.13 (required by Mopidy 4) with
    # GStreamer / PyGObject system packages, used via tox sitepackages.
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        toxenv: [mopidy3, mopidy4]
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates tox python3-venv python3-gi \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/checkout@v7
        with:
          # full history so hatch-vcs can derive the version from tags
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}
